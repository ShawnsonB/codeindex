[project]
name = "codeindex"
version = "0.1.0"
description = "Local, self-hosted semantic code search MCP server for Claude Code"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ShawnsonB" }]
requires-python = ">=3.11"
keywords = ["mcp", "claude", "code-search", "semantic-search", "chromadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "chromadb>=0.6",
    "mcp>=1.0",
    "sentence-transformers>=3.0",
    "watchdog>=4.0",
]

[project.urls]
Homepage = "https://github.com/ShawnsonB/codeindex"
Repository = "https://github.com/ShawnsonB/codeindex"

[project.scripts]
codeindex = "codeindex.server:run"

[tool.setuptools.packages.find]
where = ["src"]
